
<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hex</title>
  <link rel="icon" href="https://xlythe.com/images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Configure Tailwind CSS to use the 'class' strategy for dark mode
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'theme-text-primary': '#404040',
              'theme-text-subtle': '#afafaf',
              'theme-bg-light': '#fafafa',
              'theme-bg-dark': '#333333',
              'theme-card-bg-light': '#ffffff',
              'theme-card-bg-dark': '#1e1e1e',
              'theme-divider-light': '#f3f3f3',
              'theme-divider-dark': '#000000',
              'theme-icon-light': '#404040',
              'theme-icon-light-hover': '#afafaf',
              'theme-icon-dark': '#ffffff',
              'theme-icon-dark-hover': '#f0f0f0',
              'theme-link-dark': '#ffcc00',
              'theme-link-dark-hover': '#ffdd44',
              // Custom button colors
              'theme-button-primary-bg-light': '#404040',
              'theme-button-primary-text-light': '#ffffff',
              'theme-button-primary-bg-light-hover': '#303030',
              'theme-button-primary-bg-dark': '#ffcc00',
              'theme-button-primary-text-dark': '#1e1e1e', // Dark text on yellow bg
              'theme-button-primary-bg-dark-hover': '#ffdd44',
              'theme-button-secondary-bg-light': '#e5e5e5',
              'theme-button-secondary-text-light': '#404040',
              'theme-button-secondary-bg-light-hover': '#d5d5d5',
              'theme-button-secondary-bg-dark': '#4a4a4a',
              'theme-button-secondary-text-dark': '#ffffff',
              'theme-button-secondary-bg-dark-hover': '#5a5a5a',
              'theme-button-icon-bg-hover-light': '#f0f0f0',
              'theme-button-icon-bg-hover-dark': '#3a3a3a',
            },
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
            },
          }
        }
      };
    }

    window.addEventListener('load', () => {
      // Define the desired minimum dimensions for your application.
      // Adjust these values as needed.
      const desiredDimensions = {
        minWidth: '800px',
        minHeight: '950px',
      };

      // Create the message object. The 'type' must match the one
      // the parent page is listening for.
      const message = {
        type: 'request-iframe-resize',
        payload: desiredDimensions,
      };

      // Send the message to the parent window.
      if (window.parent) {
        window.parent.postMessage(message, '*');
      }
    });
  </script>
  <style>
    html, body, #root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevent scrollbars that might affect viewport calculation */
    }
    body {
      font-family: 'Roboto', sans-serif;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent; /* Theme will handle */
    }
    ::-webkit-scrollbar-thumb {
      background-color: #afafaf; /* theme-text-subtle for light */
      border-radius: 4px;
    }
    html.dark ::-webkit-scrollbar-track {
      background: transparent;
    }
    html.dark ::-webkit-scrollbar-thumb {
      background-color: #777777; /* A bit darker than #afafaf for dark scrollbar on dark bg */
    }
    
    /* Focus outline removal */
    *:focus {
      outline: none !important;
    }

    /* Global selection color - optional, based on new theme */
    ::selection {
      background-color: #404040; /* theme-text-primary */
      color: #ffffff;
    }
    html.dark ::selection {
        background-color: #ffcc00; /* theme-link-dark */
        color: #1e1e1e; /* theme-card-bg-dark or similar dark text */
    }

    /* Cell hover effects using CSS custom properties */
    .hex-cell-empty-hoverable:not([disabled]):hover {
      background-color: var(--empty-cell-hover-bg);
      /* Opacity is no longer set here; transparency is part of the background-color itself (rgba) */
      /* Transition for background-color is handled by 'transition-all' on the button itself in Cell.tsx */
    }

    /* Base style for swappable cells to enable pseudo-element positioning */
    .hex-cell-swappable-hoverable {
      position: relative; /* Needed for absolute positioning of ::before */
    }

    /* Pseudo-element for swappable cell hover overlay */
    .hex-cell-swappable-hoverable::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--swappable-cell-hover-overlay-bg, transparent); /* Default to transparent if var not set */
      opacity: 0; /* Start transparent */
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      z-index: 1; /* Ensure overlay is on top of base cell content */
      pointer-events: none; /* Allow clicks to pass through to the button */
      transition: opacity 0.2s ease-in-out; /* Smooth transition for opacity */
    }

    .hex-cell-swappable-hoverable:not([disabled]):hover::before {
      opacity: var(--swappable-cell-hover-overlay-opacity, 0.7); /* Default to 0.7 if var not set */
    }
  </style>
</head>
<body class="bg-theme-bg-light dark:bg-theme-bg-dark text-theme-text-primary dark:text-theme-icon-dark transition-colors duration-300">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
